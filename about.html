
<div class="about-image">
  <img id="about-slideshow" src="images/images/Image/Bulp.JPG"
       alt="Selected work by William Niels Møller Nielsen"
       style="width: 400%; display: block; position: relative; left: 150px; opacity: 1; transition: opacity 0.5s ease;">
</div>

<script>
  const slideshowImages = [
    "images/images/Image/Bulp.JPG",
    "images/images/Image/foto1.JPG",
    "images/images/Image/foto2.JPG",
       "images/images/Image/foto3.JPG",
     "images/images/Image/foto4.JPG",
     "images/images/Image/foto5.JPG",
  ];

  const slideshow = document.getElementById("about-slideshow");
  let currentIndex = 0;

  setInterval(() => {
    slideshow.style.opacity = 0;

    setTimeout(() => {
      currentIndex = (currentIndex + 1) % slideshowImages.length;

      slideshow.onload = () => {
        slideshow.style.opacity = 1;
      };

      slideshow.onerror = () => {
        slideshow.style.opacity = 1;
        console.error("Kunne ikke indlæse billedet:", slideshow.src);
      };

      slideshow.src = slideshowImages[currentIndex];
    }, 500);

  }, 5000);
</script>



</body>

</html>
