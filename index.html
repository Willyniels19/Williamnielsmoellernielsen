<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>William Niels Møller Nielsen</title>
  <style>
    html,body{height:100%;margin:0}
    body{
      background-image:url('images/images/djk3års2025_Photo-MikkelKaldal-10.jpg');
      background-size:cover;
      /* flyt billedet lidt op */
      background-position:center 30%;
      background-repeat:no-repeat;
      font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:#fff;
    }
    nav{position:fixed;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
    /* fjern kasserne: ingen baggrund, ingen border-radius, mindre padding */
    nav a{pointer-events:auto;color:#fff;text-decoration:none;padding:4px 6px;border-radius:0;transition:opacity .15s, transform .15s;font-weight:500;letter-spacing:0.02em}
    nav a.left{}
    nav a.right{}
    nav a:hover{opacity:0.85;transform:translateY(-1px)}
    /* lille skygge på teksten så den står ud over billedet */
    nav a{ text-shadow:0 2px 6px rgba(0,0,0,0.6) }
    .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
    @media (max-width:520px){nav{top:12px;left:12px;right:12px}nav a{font-size:14px}}
  </style>
</head>
<body>
  <nav>
    <a class="left" href="selected.html">Selected works</a>
    <a class="right" href="about.html">About</a>
  </nav>
  <main>
    <a href="selected.html" class="visually-hidden">Enter site — Selected works</a>
  </main>
</body>
</html>
