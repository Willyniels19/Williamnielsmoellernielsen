
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>William Niels Møller Nielsen</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      font-family: inherit;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
      pointer-events: none;
    }

    nav a {
      pointer-events: auto;
      color: white;
      text-decoration: none;
      font-size: 16px;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
    }

    nav a:hover {
      opacity: 0.65;
    }

    .landing-image {
      display: block;
      width: 100%;
      height: 100%;
      position: relative;
      cursor: pointer;
    }

    .landing-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">Selected works</a>
    <a href="about.html">About</a>
  </nav>

  <a class="landing-image" href="index.html"
     aria-label="Enter selected works">
    <img
      src="images/Bulp.JPG"
      alt="William Niels Møller Nielsen — selected work">
  </a>

</body>
</html>
